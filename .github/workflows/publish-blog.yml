name: Publish automated blog post

on:
  workflow_dispatch:
  schedule:
    # America/Chicago has DST, so run UTC candidates and let the script
    # publish once in each local 8:17, 12:17, and 16:17 window.
    # Extra checks protect against delayed GitHub scheduled runs.
    - cron: "17,27,37,47 13,14,17,18,21,22 * * 1-5"

concurrency:
  group: automated-blog-publisher-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate article
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_BLOG_MODEL || 'gpt-5-mini' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run blog:publish

      - name: Commit generated article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_html/src/blog blog-automation
          if git diff --cached --quiet; then
            echo "No generated article to commit."
            exit 0
          fi
          git commit -m "Publish automated blog post"
          git push origin main

      - name: Submit updated sitemap to Google Search Console
        if: steps.generate.outputs.post_url != ''
        env:
          GOOGLE_SEARCH_CONSOLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_EMAIL }}
          GOOGLE_SEARCH_CONSOLE_PRIVATE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://russelldigitalads.com/' }}
          GSC_SITEMAP_URL: ${{ steps.generate.outputs.sitemap_url }}
          POST_URL: ${{ steps.generate.outputs.post_url }}
        run: npm run gsc:submit-sitemap
